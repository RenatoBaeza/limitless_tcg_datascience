[project]
name = "limitless-tcg-api"
version = "0.1.0"
description = "FastAPI service for Limitless TCG data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "httpx2>=2.9.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
