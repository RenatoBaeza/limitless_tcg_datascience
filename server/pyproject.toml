[project]
name = "pktcg-duelmeta-api"
version = "0.1.0"
description = "PKTCG DuelMeta: FastAPI service for Limitless TCG tournament data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "httpx2>=2.9.1",
    "pillow>=11.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
analysis = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
